kind = "web"
previewPath = "/"
title = "Salud intestinal · Vetanco"
description = "Tablero de seguimiento de la campaña Salud intestinal de Vetanco en Meta Ads, con resultados, embudo de visualización y cobertura geográfica."
version = "1.0.0"
id = "artifacts/impacto-biologico"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19021

[services.development]
run = "pnpm --filter @workspace/impacto-biologico run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/impacto-biologico", "run", "build" ]
serve = "static"
publicDir = "artifacts/impacto-biologico/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19021"
BASE_PATH = "/"
